<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent a Vehicle</title>
    <script src="Js/javascript.js"></script>
</head>
<body>
    <h1>Rent a vehicle</h1>

    <h2>Time to rent a vehicle and unlock a new vision</h2>

    <form id="carForm">
        
        <label for="brand">Brand: </label>
        <input type="text" id="brand" placeholder="Brand" required><br>

        <label for="model">Model:</label>
        <input type="text" id="model" placeholder="Model" required><br>

        <label for="year">Year:</label>
        <input type="number" id="year" placeholder="Year" required><br>

        <label for="plate">Plate:</label>
        <input type="text" id="plate" placeholder="Plate" required><br>

        <select id="rented">
            <option value="false">Disponible</option>
            <option value="true">Rented</option>
        </select><hr>

        <button type="button" onclick="insertCarR()">Add car</button>
    </form>

    </form>

</body>
</html>
